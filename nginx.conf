server {
    listen 5001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Real per-route files exist (see scripts/postbuild.mjs); the final
    # /index.html is just a safety net for any unforeseen path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
